# Weekly updates for the app's libraries, monthly for the build tools and the
# Docker base image (within the same Node version); each grouped into one pull
# request. Security fixes come
# straight away. Nothing here releases anything: updates go out with the next
# release.
version: 2
updates:
  - package-ecosystem: npm
    directory: /panalume/app
    schedule: { interval: weekly }
    groups: { libraries: { patterns: ["*"] } }
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { actions: { patterns: ["*"] } }
    labels: [dependencies]
  - package-ecosystem: docker
    directory: /panalume
    schedule: { interval: monthly }
    labels: [dependencies]
    # Moving to a new Node version changes what every install runs on, so
    # that's done on purpose in a release, not suggested here.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
