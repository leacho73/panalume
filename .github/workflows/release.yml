# Builds the app on every push and pull request. On main, when the app's
# version (panalume/config.yaml) is one that hasn't been released yet, tags it
# and publishes a GitHub release with that version's CHANGELOG section.
# Home Assistant itself updates from config.yaml; releases are the human record.
#
# Two kinds of image:
# - Home Assistant downloads ready-made images (ghcr.io/<owner>/{arch}-panalume:<version>,
#   built from panalume/Dockerfile) rather than building Panalume itself. They're pushed
#   by the release pull request, so they exist before the new version reaches main and
#   anyone's Home Assistant. (panalume/config.yaml's image: line, which points Home
#   Assistant at them, goes in with the version bump of the first release that has them.)
# - The standalone Docker image (ghcr.io/<owner>/panalume, docker/Dockerfile) for Home
#   Assistant installs without the app store, published with each release.
name: Build and release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panalume/app/package-lock.json
      - run: npm ci
        working-directory: panalume/app
      - run: npm run build
        working-directory: panalume/app
      # Check the standalone Docker image still builds for every platform it's
      # published for (not published here), then start it and check it refuses
      # to run without a password, and serves the sign-in page with one.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: panalume:test
          cache-from: type=gha
      - name: Start the image
        run: |
          # No password: it must refuse to start (exit non-zero, quickly) and say why.
          set +e; out=$(timeout 30 docker run --rm panalume:test 2>&1); code=$?; set -e
          echo "$out"
          if [ "$code" -eq 0 ] || [ "$code" -eq 124 ] || ! echo "$out" | grep -q 'PANALUME_PASSWORD'; then echo "::error::the image should refuse to start without PANALUME_PASSWORD"; exit 1; fi
          docker run -d --name pan -p 8099:8099 -e PANALUME_PASSWORD=ci-test-password panalume:test
          for i in $(seq 1 20); do curl -fs -o /dev/null http://localhost:8099/ && break; sleep 1; done
          curl -fs http://localhost:8099/ | grep -qi 'sign in'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8099/api/config)" = 401
          docker logs pan 2>&1 | tee /dev/stderr | grep -q 'No Home Assistant token'
          docker rm -f pan

  image:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Work out the version, and whether to publish it
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          SAME_REPO: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          V=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' panalume/config.yaml)
          if [ -z "$V" ]; then echo "No version found"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          # Only a version that isn't released yet, and never from a fork.
          if [ "$SAME_REPO" = true ] && ! gh release view "v$V" >/dev/null 2>&1; then echo "push=true" >> "$GITHUB_OUTPUT"; else echo "push=false" >> "$GITHUB_OUTPUT"; fi
      - run: docker buildx create --use
      - if: steps.v.outputs.push == 'true'
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build both Home Assistant images (and push them for a new version)
        run: |
          for a in amd64:linux/amd64 aarch64:linux/arm64; do
            docker buildx build panalume --platform "${a#*:}" \
              --build-arg BUILD_VERSION=${{ steps.v.outputs.version }} --build-arg BUILD_ARCH="${a%%:*}" \
              -t "${{ steps.v.outputs.repo }}/${a%%:*}-panalume:${{ steps.v.outputs.version }}" \
              $([ "${{ steps.v.outputs.push }}" = true ] && echo --push)
          done
      - name: Check anyone can download them
        if: steps.v.outputs.push == 'true'
        run: |
          for a in amd64 aarch64; do
            r="${{ steps.v.outputs.repo }}/$a-panalume"; r="${r#ghcr.io/}"
            tok=$(curl -fsS "https://ghcr.io/token?scope=repository:$r:pull" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
            if ! curl -fsS -o /dev/null -H "Authorization: Bearer $tok" -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" "https://ghcr.io/v2/$r/manifests/${{ steps.v.outputs.version }}"; then
              echo "::error::$r can't be downloaded without logging in. Make the package public: GitHub → Packages → $a-panalume → Package settings → Change visibility."
              exit 1
            fi
          done

  release:
    needs: [build, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Release the version in config.yaml if it's new
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' panalume/config.yaml)
          if [ -z "$V" ]; then echo "No version found"; exit 1; fi
          # The standalone image is published unless it's already there, so re-running
          # a release whose image push failed still publishes it.
          if ! docker manifest inspect "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/panalume:$V" >/dev/null 2>&1; then echo "version=$V" >> "$GITHUB_OUTPUT"; fi
          if gh release view "v$V" >/dev/null 2>&1; then echo "v$V is already released"; exit 0; fi
          # This version's section of the changelog, without its heading.
          awk -v v="## $V" '$0 == v { f = 1; next } /^## / && f { exit } f' panalume/CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "- See CHANGELOG.md" > notes.md; fi
          printf '\n---\nUpdate from **Settings → Apps → Panalume** in Home Assistant. Full history: [CHANGELOG.md](https://github.com/%s/blob/main/panalume/CHANGELOG.md)\n' "$GITHUB_REPOSITORY" >> notes.md
          # Until 1.0, every release is a beta (pre-release).
          case "$V" in 0.*) PRE=--prerelease; TITLE="Panalume $V (beta)" ;; *) PRE=--latest; TITLE="Panalume $V" ;; esac
          gh release create "v$V" --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md $PRE
      # Publish the standalone image for the new release: amd64 and 64-bit / 32-bit ARM.
      - if: steps.rel.outputs.version
        uses: docker/setup-qemu-action@v3
      - if: steps.rel.outputs.version
        uses: docker/setup-buildx-action@v3
      - if: steps.rel.outputs.version
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - if: steps.rel.outputs.version
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/panalume:${{ steps.rel.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/panalume:latest
